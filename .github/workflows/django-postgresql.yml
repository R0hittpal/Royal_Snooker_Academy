name: Django PostgreSQL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rsa_ci
          POSTGRES_USER: rsa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa_ci -d rsa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://rsa_ci:ci-only-password@127.0.0.1:5432/rsa_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite on PostgreSQL
        run: python manage.py test --verbosity 2
